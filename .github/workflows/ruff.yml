name: Ruff

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.17.5  # keep in sync with requirements-dev.txt

    - name: Lint
      run: |
        ruff check src

    - name: Check formatting
      run: |
        ruff format --check src
